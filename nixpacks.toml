[variables]
COMPOSER_ALLOW_SUPERUSER = "1"
NIXPACKS_PHP_VERSION = "8.2"
[phases.setup] nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.gd", "php82Extensions.mbstring", "php82Extensions.pdo_mysql", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.sqlite", "nodejs_20"]
aptPkgs = ["libpng-dev", "libjpeg-dev", "libfreetype6-dev", "libzip-dev"]
[phases.install] cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs", "npm install"]
[phases.build] cmds = ["npm run build"]
[start] cmd = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
